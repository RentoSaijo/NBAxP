<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width'>

    <!-- D3 + helpers -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src='https://cdnjs.cloudflare.com/ajax/libs/d3-legend/2.24.0/d3-legend.min.js'></script>
    <script src="https://d3js.org/d3-contour.v1.min.js"></script>
    <script src="https://d3js.org/d3-scale-chromatic.v1.min.js"></script>

    <!-- Your JS files -->
    <script src='regions.js'></script>
    <script src='Court.js'></script>


    <link href='https://fonts.googleapis.com/css?family=Open+Sans:400,400i,700' rel='stylesheet'>
    <title>Visualization Project</title>
</head>
<body>
<body>
<style>
    body {
        font-family: 'Open Sans', sans-serif;
        margin: 0;
    }

    /* main horizontal layout */
    .layout {
        display: flex;
        height: 100vh;          /* full screen height */
    }

    /* left side: caption + stats */
    .left-panel {
        flex: 1;
        padding: 16px;
        box-sizing: border-box;
    }

    /* right side: court */
    #court {
        flex: 0 0 40%;          /* court takes 60% of width on the right */
        position: relative;     /* let JS size the SVG inside */
    }
</style>

<div class="layout">
    <div class="left-panel">
        <h2 id='caption'></h2>
        <div id='stats'></div>
    </div>

    <div id='court'></div>
</div>
</body>


<!-- no inline <script> here anymore; Court.js handles setup -->

</body>
</html>
